server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/weather_insight_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password="YourPasswordHere"
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

app.jwt.secret=YourSuperLongKeyForJWTGeneration
app.jwt.expiration=86400000

logging.level.com.weather=INFO
logging.level.org.springframework.security=WARN